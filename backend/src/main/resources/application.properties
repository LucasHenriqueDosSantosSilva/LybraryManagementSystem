spring.application.name=library
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never
library.time-zone=${LIBRARY_TIME_ZONE:America/Sao_Paulo}
library.loan-days=${LIBRARY_LOAN_DAYS:14}

library.auth.enabled=${LIBRARY_AUTH_ENABLED:true}
library.auth.username=${LIBRARY_ADMIN_USERNAME:bibliotecario}
library.auth.password=${LIBRARY_ADMIN_PASSWORD:}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${LIBRARY_COOKIE_SECURE:false}

library.auth.login-limit=${LIBRARY_LOGIN_LIMIT:10}
library.auth.login-window-seconds=${LIBRARY_LOGIN_WINDOW_SECONDS:60}
